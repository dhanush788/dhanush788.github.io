<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Dhanush P K</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0a0b'/><text x='50' y='71' font-family='Georgia,serif' font-size='62' font-weight='700' fill='%23ff6b35' text-anchor='middle'>D</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--text:#edecea;--muted:#9b9ba4;--border:#232329;--surface:#121214;--accent:#ff6b35}
@media(prefers-color-scheme:light){:root{--bg:#fbfaf8;--text:#16161a;--muted:#5e5e68;--border:#e6e3de;--surface:#fff;--accent:#d8491a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
 font-family:'Inter',-apple-system,system-ui,sans-serif;text-align:center;padding:30px}
.code{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.14em;margin-bottom:18px}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:600;letter-spacing:-.035em;margin:0 0 14px}
p{color:var(--muted);margin:0 0 30px;max-width:40ch}
a{display:inline-flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:14.5px;
 border:1px solid var(--border);background:var(--surface);padding:11px 20px;border-radius:10px;
 transition:border-color .2s,transform .2s}
a:hover{border-color:var(--accent);transform:translateY(-2px)}
</style>
</head>
<body>
<div>
  <div class="code">ERROR 404</div>
  <h1>This page doesn't exist</h1>
  <p>The link is broken or the page moved. Everything worth seeing is on the front page.</p>
  <a href="/">← Back to the portfolio</a>
</div>
</body>
</html>
