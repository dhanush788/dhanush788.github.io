<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Dhanush P K</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f0e7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f3f0e7'/><text x='50' y='76' font-family='Georgia,serif' font-weight='bold' font-size='78' fill='%23191714' text-anchor='middle'>D</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f0e7;--ink:#191714;--soft:#4c483f;--faint:#7e7869;--rule:#c7c0ae}
@media(prefers-color-scheme:dark){:root{--paper:#15140f;--ink:#e9e4d7;--soft:#a9a395;--faint:#7d7768;--rule:#3a362e}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:'Source Serif 4',Charter,Georgia,serif;font-size:16px;line-height:1.55}
.sheet{max-width:680px;margin:0 auto;padding:30px 24px}
.rule-heavy{border-top:4px solid var(--ink)}
.rule-thin{border-top:1px solid var(--ink);margin-top:3px}
h1{font-family:'Playfair Display',serif;font-weight:900;text-transform:uppercase;
 font-size:clamp(2rem,7vw,3.4rem);text-align:center;line-height:1;margin:16px 0 12px}
.dateline{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
 padding:7px 2px;font-size:.645rem;letter-spacing:.17em;text-transform:uppercase;
 display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 18px}
.body{margin-top:34px;text-align:center}
.body p{color:var(--soft);margin:0 0 14px}
.body .big{font-family:'Playfair Display',serif;font-style:italic;font-size:1.5rem;color:var(--ink)}
a{color:inherit;border-bottom:1px solid var(--rule)}
a:hover{border-bottom-color:var(--ink)}
.folio{margin-top:40px;border-top:4px solid var(--ink);padding-top:9px;
 font-size:.645rem;letter-spacing:.17em;text-transform:uppercase;color:var(--faint);text-align:center}
</style>
</head>
<body>
<div class="sheet">
  <div class="rule-heavy"></div><div class="rule-thin"></div>
  <h1>Dhanush P K</h1>
  <div class="dateline"><span>Kochi, India</span><span>Error 404</span></div>
  <div class="body">
    <p class="big">This page was never printed.</p>
    <p>The link is wrong, or the page has moved.</p>
    <p><a href="/">Return to the front page</a></p>
  </div>
  <div class="folio">&copy; 2026 Dhanush P K</div>
</div>
</body>
</html>
