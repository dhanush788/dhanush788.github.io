name: Build resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'resume/resume.tex'
      - '.github/workflows/resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume

      - name: Publish PDF to site root
        run: |
          mv resume/resume.pdf ./resume.pdf
          rm -f resume/*.aux resume/*.log resume/*.out resume/*.fls resume/*.fdb_latexmk

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if git diff --staged --quiet; then
            echo "resume.pdf unchanged"
            exit 0
          fi
          git commit -m "ci: rebuild resume.pdf"
          # main may have moved while we compiled — rebase and retry rather than fail
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
